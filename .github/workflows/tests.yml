name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-desktop:
    runs-on: windows-latest
    env:
      # Playwright drives the app's own Electron binary — skip the browser
      # binaries @playwright/test's postinstall would otherwise download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright drives the app's own Electron binary — no browser install
      # step is needed and none should be added.
      - name: Run E2E tests
        run: npx playwright test